; Configuração do Zombie (AO VIVO). O mapa é o /Engine/Maps/Entry, vazio: o AZMBGameMode monta a cidade de protótipo,
; o céu e a luz em código (Game/ZMBWorldBuilder), como a arena do Detonauto. Nenhum .umap do projeto por enquanto.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/Zombie.ZMBGameMode

[/Script/Engine.RendererSettings]
; Base de renderização herdada do Detonauto (lote 15, conferida no código da engine 5.8; ver docs/tecnico.md).
; 1 = Lumen na luz indireta (GI) e nos reflexos; sombras virtuais; campos de distância; TSR; tudo dinâmico (dia e noite).
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AntiAliasingMethod=4
r.AllowStaticLighting=False
; Skin cache na GPU: os personagens finais (MetaHuman, zumbis com dano por morph target) dependem dele.
r.SkinCache.CompileShaders=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; Neblina volumétrica: fumaça das explosões, poeira e a luz dos postes à noite.
r.VolumetricFog=1
; Lumen por software (campos de distância), como no Detonauto. Ray tracing por hardware fica para medir com a cena final
; (a meta é 60 fps num PC nível PS5; RTX 4070 Ti no PC do Felipe).

[SystemSettings]
; Exposição física de dia (EV 13 a 15) cabe no cache de luz do Lumen com 8 (ver o comentário igual no Detonauto).
r.EyeAdaptation.CachedLightingPreExposure=8

[/Script/Engine.CollisionProfile]
; Canal próprio dos zumbis: o carro deixa passar (atropela) e o jogador continua batendo nele. Ver Zombie.h (ECC_ZMBZombie).
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="Zombie")

[/Script/Engine.PhysicsSettings]
; Muitos pedaços soltos e carros arremessados: subpassos deixam a física estável com quadros longos.
bSubstepping=True
MaxSubstepDeltaTime=0.016667
MaxSubsteps=6

; Unreal MCP (plugin ModelContextProtocol, só no editor). Portas do estúdio: Detonauto 8010, Age of Earth 8020,
; TDFende 8030, Zombie 8040 (dois editores abertos não brigam). Mesmos nomes de configuração do Detonauto.
[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
bAutoStartServer=True
ServerPortNumber=8040
ServerUrlPath=/mcp
